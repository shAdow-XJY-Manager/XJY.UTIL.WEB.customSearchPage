<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="简洁的新标签页，本地背景与自由布局。">
  <title>新标签页</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <span id="font-probe" aria-hidden="true"></span>
  <img id="background" alt="" hidden>
  <div id="shade" hidden></div>
  <main id="scene">
    <div id="search-shell" role="group" aria-label="搜索框布局" tabindex="-1">
      <form id="search-form" role="search" autocomplete="off">
        <button id="engine-button" class="icon-button engine-button" type="button" aria-label="切换搜索引擎" aria-haspopup="menu" aria-expanded="false" aria-controls="engine-menu" disabled>
          <img id="engine-icon" alt="" width="22" height="22">
          <span class="icon icon-chevron" aria-hidden="true"></span>
        </button>
        <input id="query" type="search" name="q" placeholder="搜索" aria-label="搜索" spellcheck="false" disabled>
        <button id="submit" class="icon-button submit" type="submit" aria-label="搜索" disabled><span class="icon icon-search" aria-hidden="true"></span></button>
      </form>
      <div id="resize-handles" hidden>
        <button class="resize-handle nw" data-edge="nw" aria-label="调整左上角" type="button"></button>
        <button class="resize-handle n" data-edge="n" aria-label="调整上边缘" type="button"></button>
        <button class="resize-handle ne" data-edge="ne" aria-label="调整右上角" type="button"></button>
        <button class="resize-handle e" data-edge="e" aria-label="调整右边缘" type="button"></button>
        <button class="resize-handle se" data-edge="se" aria-label="调整右下角" type="button"></button>
        <button class="resize-handle s" data-edge="s" aria-label="调整下边缘" type="button"></button>
        <button class="resize-handle sw" data-edge="sw" aria-label="调整左下角" type="button"></button>
        <button class="resize-handle w" data-edge="w" aria-label="调整左边缘" type="button"></button>
      </div>
    </div>
  </main>
  <div id="engine-menu" class="engine-menu" role="menu" aria-label="搜索引擎" hidden></div>
  <button id="settings-button" class="icon-button settings-button" type="button" aria-label="设置" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false"><span class="icon icon-settings" aria-hidden="true"></span></button>
  <div id="drawer-backdrop" hidden></div>
  <aside id="settings" class="drawer" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <header><h1 id="settings-title">设置</h1><button id="close-settings" class="icon-button" type="button" aria-label="关闭设置"><span class="icon icon-close" aria-hidden="true"></span></button></header>
    <div class="drawer-content">
      <section><h2>搜索</h2><label class="row" for="new-tab"><span>在新标签打开结果</span><input id="new-tab" type="checkbox" role="switch"></label></section>
      <section><h2>背景</h2>
        <div class="actions"><button id="choose-background" type="button">选择本地图片</button><button id="clear-background" class="quiet" type="button">恢复纯色</button></div>
        <input id="background-file" type="file" accept="image/*" hidden>
        <p class="hint">最大 32 MB、1600 万像素。自动缩小至 1920 px 并压缩为 JPEG；压缩后最大 2 MB，仅保存在本机。</p>
        <label class="row" for="background-fit"><span>图片适配</span><select id="background-fit"><option value="0">原始大小</option><option value="1">拉伸</option><option value="2">缩小</option><option value="3">覆盖</option><option value="4">包含</option><option value="5">适应宽度</option><option value="6">适应高度</option></select></label>
        <label class="row" for="overlay"><span>背景遮罩</span><output id="overlay-value" for="overlay">0%</output></label><input id="overlay" type="range" min="0" max="100" step="1" aria-label="背景遮罩">
      </section>
      <section><h2>外观</h2><label class="row" for="theme"><span>主题</span><select id="theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
        <details id="advanced-colors"><summary>自定义颜色</summary><label class="row" for="custom-color"><span>启用</span><input id="custom-color" type="checkbox" role="switch"></label><div id="color-fields"></div></details>
      </section>
      <section><h2>布局</h2><button id="edit-layout" type="button">编辑布局</button><p class="hint">自由拖动搜索框，拉伸边缘或四角调整大小。</p></section>
      <section class="reset-section"><button id="reset-all" class="quiet" type="button">恢复全部默认设置</button></section>
      <p id="settings-status" class="status" role="status" aria-live="polite"></p>
    </div>
  </aside>
  <div id="edit-toolbar" class="edit-toolbar" role="toolbar" aria-label="布局编辑" hidden>
    <button id="reset-layout" class="quiet" type="button">重置</button><button id="cancel-layout" class="quiet" type="button">取消</button><button id="save-layout" class="primary" type="button">完成</button>
    <span id="edit-status" class="status" role="status" aria-live="polite"></span>
  </div>
  <p id="edit-hint" class="edit-hint" hidden>拖动移动，拉伸边角。方向键微调，Shift 加速，Esc 取消。</p>
</body>
</html>
